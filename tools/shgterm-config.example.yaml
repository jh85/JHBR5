# shgterm configuration for JHBR5 on floodgate.
#
# Engine: JHBR5 (CPU NNUE MCTS). Networks live in /path/to/JHBR5/nets/
# (value.nn, policy.nn); replace them to play a newer generation.
# Threads: the i7-10870H has 8 physical cores; leave 6 for the search when
# nothing else runs, lower it if training runs at the same time.
usi:
  name: JHBR5
  path: /path/to/JHBR5/build/jhbr5
  options:
    ValueNet: {type: string, value: /path/to/JHBR5/nets/value.nn}
    PolicyNet: {type: string, value: /path/to/JHBR5/nets/policy.nn}
    Threads: {type: spin, value: 6}
    EvalCacheMB: {type: spin, value: 256}
    TreeMemoryMB: {type: spin, value: 24576}
    LeafMateDepth: {type: spin, value: 5}
    RootMateDepth: {type: spin, value: 7}
    TimeManagement: {type: combo, value: "on"}
    MoveOverheadMs: {type: spin, value: 800}
    USI_Ponder: {type: check, value: false}
  enableEarlyPonder: false

# CSA server
server:
  protocolVersion: v121_floodgate   # or v121
  host: wdoor.c.u-tokyo.ac.jp
  port: 4081
  id: YOUR_LOGIN_ID
  password: YOUR_PASSWORD
  tcpKeepalive:
    initialDelay: 10
  # Optional:
  # blankLinePing:
  #   initialDelay: 40
  #   interval: 40

repeat: 1
autoRelogin: true
restartPlayerEveryGame: false

saveRecordFile: true
enableComment: true
recordFileNameTemplate: "{datetime}{_title}{_sente}{_gote}"
recordFileFormat: .csa
